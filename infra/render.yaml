services:
  - type: web
    name: wiki-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run --workspace @wiki/shared build && npm run --workspace @wiki/api build
    startCommand: npm run --workspace @wiki/api start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_ORIGIN
        value: https://wiki-web.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: wiki-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run --workspace @wiki/shared build && npm run --workspace @wiki/web build
    startCommand: npm run --workspace @wiki/web preview -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_BASE_URL
        value: https://wiki-api.onrender.com/api
